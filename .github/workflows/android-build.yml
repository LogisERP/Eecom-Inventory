name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers too

jobs:
  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Build Vite web app ─────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 5. Install Capacitor CLI globally ─────────────────────────────────
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # ── 6. Setup Java (required for Gradle) ───────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 7. Accept Android SDK licenses ────────────────────────────────────
      # ubuntu-latest already ships with the Android SDK at $ANDROID_SDK_ROOT.
      # We bypass the interactive sdkmanager prompt by writing the license
      # hash files directly — this is the canonical CI approach.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/google-gdk-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_SDK_ROOT/licenses/android-googletv-license"
          echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" > "$ANDROID_SDK_ROOT/licenses/mips-android-sysimage-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d" > "$ANDROID_SDK_ROOT/licenses/intel-android-extra-license"

      # ── 8. Sync Capacitor -> Android ──────────────────────────────────────
      # "npx cap sync android" copies dist/ into the android/ project and
      # updates any Capacitor plugins.
      - name: Sync Capacitor Android project
        run: npx cap sync android

      # ── 9. Make gradlew executable ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build Debug APK ───────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 11. Upload APK as artifact ────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ecom-erp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
